# SonarQube Project Configuration

# Project Identification
sonar.projectKey=newsradar
sonar.projectName=NewsRadar - News Monitoring System
sonar.projectVersion=1.0.0
sonar.sources=backend/app,frontend/src

# Python Configuration (Backend)
sonar.python.baseDir=backend
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.exclusions=**/__pycache__/**,**/tests/**,**/.venv/**,**/venv/**
sonar.python.version=3.11

# TypeScript/Vue Configuration (Frontend)
sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# General exclusions
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/venv/**,.venv/**,**/dist/**,**/build/**

# Code coverage
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*.spec.ts,**/*.spec.js,**/migrations/**

# Source encoding
sonar.sourceEncoding=UTF-8

# Quality Gates
sonar.qualitygate.wait=true
