name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DISABLE_SCHEDULER: "1"
  DATABASE_URL: "sqlite:///./test.db"

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        working-directory: backend
        run: pytest tests/unit -v --tb=short

      - name: Run functional tests
        working-directory: backend
        run: pytest tests/functional -v --tb=short

      - name: Run e2e tests
        working-directory: backend
        run: pytest tests/e2e -v --tb=short

      - name: Run API endpoint tests
        working-directory: backend
        run: pytest tests/test_api_endpoints.py -v --tb=short

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: newsradar-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: newsradar-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env <<EOF
          DATABASE_URL=sqlite:///./news.db
          DISABLE_SCHEDULER=0
          APP_BASE_URL=http://localhost:8000
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Deploy with Docker Compose
        run: docker compose up --build -d

      - name: Verify backend is healthy
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/docs > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend... ($i/10)"
            sleep 5
          done
          echo "Backend health check failed"
          docker compose logs backend
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down
